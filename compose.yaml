services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: failuremesh
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: failuremesh
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failuremesh -d failuremesh"]
      interval: 2s
      timeout: 2s
      retries: 10
