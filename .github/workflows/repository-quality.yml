name: Repository quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: failuremesh
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: failuremesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U failuremesh -d failuremesh"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      FAILUREMESH_TEST_DATABASE_URL: postgres://failuremesh:synthetic-only@127.0.0.1:5432/failuremesh?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Gate A and Markdown checks
        run: |
          python3 scripts/validate_gate_a.py
          python3 scripts/check_markdown_links.py
          python3 -B -m unittest discover -s scripts/tests -v
      - name: Go formatting and module integrity
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi
          go mod verify
      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Committed whitespace check
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
